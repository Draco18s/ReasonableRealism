plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
    id 'net.minecraftforge.renamer' version '1.0.14'
}

version = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: '1.0' }.getOrElse('1.0')
group = 'com.draco18s'
base.archivesName = "ReasonableRealism-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The distributable jar uses SRG names; the dev runtime uses Mojang names.
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', 'harderores'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            args '--mod', 'harderores', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Harder Ores' ore generation comes from CustomOreGen modules (see hardlib.CogHelper): a COG 1.21.1 build
    // (its Mojang-named jar, for the dev runtime).
    implementation files('libs/customoregen-1.21.1.jar')
}
renamer.mappings(minecraft.dependency.toSrg)

jar {
    manifest {
        attributes([
                "Specification-Title"     : "harderores",
                "Specification-Vendor"    : "draco18s",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "draco18s"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000']
}
