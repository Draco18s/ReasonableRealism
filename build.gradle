plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: '1.0' }.getOrElse('1.0')
group = 'com.draco18s'
base.archivesName = "ReasonableRealism-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'harderores'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            data()
            programArguments.addAll '--mod', 'harderores', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    // One jar holds all of these mods.
    mods {
        harderores {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Harder Ores' ore generation comes from CustomOreGen modules (see hardlib.CogHelper): a COG NeoForge 1.21.1 build,
    // which isn't in the repository (players download COG separately).
    implementation files('libs/customoregen-1.21.1-neoforge.jar')
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "harderores",
                "Specification-Vendor"    : "draco18s",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "draco18s"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000']
}
