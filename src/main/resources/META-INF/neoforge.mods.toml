modLoader="javafml"
loaderVersion="[4,)"
license="All rights reserved"
showAsResourcePack=false

# Opens up the vanilla code these mods need (see the file).
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
    modId="hardlib"
    version="1.0.0.0"
    displayName="Hardlib"
    displayURL="neoforged.net"
    credits="."
    authors="Draco18s"
    description='''
	Basic library. Provides a common platform for registering blocks, items, etc. as well as integration between the various child mods and external plugins.
	'''
    displayTest="MATCH_VERSION"

	[[dependencies.hardlib]]
		modId="neoforge"
		type="required"
		versionRange="[26.3,)"
		ordering="NONE"
		side="BOTH"

	[[dependencies.hardlib]]
		modId="minecraft"
		type="required"
		versionRange="[26.3,26.4)"
		ordering="NONE"
		side="BOTH"
		
[[mods]] #mandatory
	modId="expindustry" #mandatory
	version="${file.jarVersion}" #mandatory
	displayName="Exp Industry" #mandatory
	authors="Draco18s" #optional
	description='''Additional blocks to facilitate vanilla-style industrial operations.'''
	[[dependencies.expindustry]] #optional
	    modId="neoforge"
	    type="required"
		versionRange="[26.3,)"
	    ordering="NONE"
	    side="BOTH"
	[[dependencies.expindustry]] #optional
	    modId="hardlib" #mandatory
	    type="required"
	    versionRange="[0,)" #mandatory
	    ordering="AFTER"
	    side="BOTH"
	[[dependencies.expindustry]]
	    modId="minecraft"
	    type="required"
		versionRange="[26.3,26.4)"
	    ordering="NONE"
	    side="BOTH"
		
[[mods]] #mandatory
	modId="harderores" #mandatory
	version="${file.jarVersion}" #mandatory
	# The sifter and packager recipe books (see client.RecipeBookEnums).
	enumExtensions="META-INF/enumextensions.json"
	displayName="Harder Ores" #mandatory
	authors="Draco18s" #optional
	description='''Mining and refining ores made more consistent, interesting, and difficult. Ores will appear in structured veins, each block will be tougher to mine, and produce less resources per block.'''
	[[dependencies.harderores]] #optional
	    modId="neoforge"
	    type="required"
		versionRange="[26.3,)"
	    ordering="NONE"
	    side="BOTH"
	[[dependencies.harderores]] #optional
	    modId="hardlib" #mandatory
	    type="required"
	    versionRange="[0,)" #mandatory
	    ordering="AFTER"
	    side="BOTH"
	[[dependencies.harderores]]
	    modId="minecraft"
	    type="required"
		versionRange="[26.3,26.4)"
	    ordering="NONE"
	    side="BOTH"
	[[dependencies.harderores]]
	    # Hard ores are generated by the CustomOreGen modules Harder Ores unpacks.
	    modId="customoregen"
	    type="required"
	    versionRange="[1.8,)"
	    ordering="NONE"
	    side="BOTH"
		
[[mods]] #mandatory
	modId="harderfarming" #mandatory
	version="${file.jarVersion}" #mandatory
	displayName="Harder Farming" #mandatory
	authors="Draco18s" #optional
	description='''Alters crop growth and a few other things to be more reasonably realistic.'''
	[[dependencies.harderfarming]] #optional
	    modId="neoforge"
	    type="required"
		versionRange="[26.3,)"
	    ordering="NONE"
	    side="BOTH"
	[[dependencies.harderfarming]] #optional
	    modId="hardlib" #mandatory
	    type="required"
	    versionRange="[0,)" #mandatory
	    ordering="AFTER"
	    side="BOTH"
	[[dependencies.harderfarming]]
	    modId="minecraft"
	    type="required"
		versionRange="[26.3,26.4)"
	    ordering="NONE"
	    side="BOTH"

[[mods]] #mandatory
	modId="oreflowers" #mandatory
	version="${file.jarVersion}" #mandatory
	displayName="Ore Flowers" #mandatory
	authors="Draco18s" #optional
	description='''Flowers that grow over ore deposits.'''
	[[dependencies.oreflowers]] #optional
	    modId="neoforge"
	    type="required"
		versionRange="[26.3,)"
	    ordering="NONE"
	    side="BOTH"
	[[dependencies.oreflowers]] #optional
	    modId="hardlib" #mandatory
	    type="required"
	    versionRange="[0,)" #mandatory
	    ordering="AFTER"
	    side="BOTH"
	[[dependencies.oreflowers]]
	    modId="minecraft"
	    type="required"
		versionRange="[26.3,26.4)"
	    ordering="NONE"
	    side="BOTH"
